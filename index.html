<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
(function(){
  var OWNER='by0628', REPO='Music', DIR='songs';
  var CDN='https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@main/'+DIR+'/';
  var AUDIO=['mp3','m4a','wav','ogg','oga','flac','aac','opus'];
  var IMG=['jpg','jpeg','png','webp'];
  var statusEl=document.getElementById('status')||{textContent:'',style:{}};/* 提示条已按要求删除，写入落到空对象上 */

  function ext(name){ var m=name.toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:''; }
  function base(name){ return name.replace(/\.[^.]+$/,''); }
  /* "歌手 - 歌名" 拆分；拆不出就整名当歌名 */
  function splitName(b){
    var i=b.indexOf(' - ');
    if(i>0) return {artist:b.slice(0,i).trim(), title:b.slice(i+3).trim()};
    i=b.indexOf('-');
    if(i>0) return {artist:b.slice(0,i).trim(), title:b.slice(i+1).trim()};
    return {artist:'', title:b};
  }

  var API='https://api.github.com/repos/'+OWNER+'/'+REPO;
  function gh(url){ return fetch(url,{headers:{'Accept':'application/vnd.github+json'}}); }
  /* 每首歌准备多条线路，一条不通自动换下一条 */
  function sourcesFor(enc, sha, big){
    /* 大文件（≥20MB）：jsDelivr 有 20MB 上限、必然 403，跳过它走 Pages/raw，少等两轮失败 */
    if(big){
      return [
        DIR+'/'+enc,
        'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc,
        'https://cdn.statically.io/gh/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc
      ];
    }
    var list=[];
    if(sha) list.push('https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@'+sha+'/'+DIR+'/'+enc);
    list.push('https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@main/'+DIR+'/'+enc);
    list.push('https://cdn.statically.io/gh/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc);
    list.push('https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc);
    list.push(DIR+'/'+enc);
    return list;
  }

  /* ---------------- lyrics engine ---------------- */
  function parseLrc(text){
    var out=[];
    (text||'').split(/\r?\n/).forEach(function(line){
      var tags=line.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/g);
      if(!tags) return;
      var txt=line.replace(/\[[^\]]*\]/g,'').trim();
      tags.forEach(function(tag){
        var m=tag.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/);
        out.push({t:parseInt(m[1],10)*60+parseFloat(m[2]), text:txt});
      });
    });
    out.sort(function(a,b){return a.t-b.t;});
    return out.filter(function(l){return l.text;});
  }
  function fetchText(urls){
    var chain=Promise.reject();
    urls.forEach(function(u){
      chain=chain.catch(function(){
        return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); });
      });
    });
    return chain;
  }
  /* 带超时的 fetch：国外源（走其官方 CDN 域名直连）不通时 7 秒熔断，不拖住整条链 */
  function fetchT(url, ms){
    ms=ms||7000;
    if(window.AbortController){
      var ctl=new AbortController();
      var t=setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, ms);
      return fetch(url, {signal: ctl.signal}).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
    }
    return fetch(url);
  }
  function lrclibGet(artist,title,dur){
    var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'')+(dur?'&duration='+Math.round(dur):'');
    return fetchT('https://lrclib.net/api/get?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function lrclibSearch(artist,title,dur){
    var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'');
    return fetchT('https://lrclib.net/api/search?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(list){
        var cand=(list||[]).filter(function(x){ return x.syncedLyrics && !x.instrumental; });
        if(!cand.length) return null;
        /* 本地打分匹配：标题/歌手吻合度在浏览器本地算分，再结合时长差挑最像的一条 */
        function score(x){
          var s=0;
          if(norm(x.trackName||'')===norm(title)) s+=4;
          if(artist && norm(artist) && norm(x.artistName||'')===norm(artist)) s+=3;
          else if(artist && norm(artist) && norm(x.artistName||'').indexOf(norm(artist))>=0) s+=1;
          return s;
        }
        if(dur){
          cand.sort(function(a,b){
            var dd=Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur);
            return dd!==0 ? dd : score(b)-score(a);
          });
          if(Math.abs((cand[0].duration||0)-dur)>6) return null;
        }else{
          cand.sort(function(a,b){ return score(b)-score(a); });
          if(score(cand[0])<4) return null;
        }
        return cand[0];
      });
  }
  /* 歌名清洗：去掉（Live）/【】/伴奏等后缀再匹配一次，常能救回对不上的歌 */
  function cleanTitle(t){
    return (t||'').replace(/[\(\[【（][^)\]】）]*[\)\]】）]/g,'').replace(/\s*[-—]\s*(live|伴奏|纯音乐|instrumental).*$/i,'').trim();
  }
  /* 最后备用歌词源：lyrics.ovh（无时间轴纯文本，按时长均分出行时间粗对齐滚动） */
  function ovhLyrics(artist,title,dur){
    if(!artist) return Promise.resolve(null);
    return fetch('https://api.lyrics.ovh/v1/'+encodeURIComponent(artist)+'/'+encodeURIComponent(title))
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        var txt=(d && d.lyrics)||'';
        var ls=txt.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
        if(ls.length<4) return null;
        var total=dur || ls.length*4.5;
        return ls.map(function(s,i){ return {t: total*i/ls.length, text:s}; });
      })
      .catch(function(){ return null; });
  }
  /* 无时间轴的纯文本歌词：按时长均分行时间粗对齐（有总比没有强） */
  function plainToLines(txt, dur){
    var ls=(txt||'').split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
    if(ls.length<4) return null;
    var total=dur || ls.length*4.5;
    return ls.map(function(s,i){ return {t: total*i/ls.length, text:s}; });
  }
  /* LRCLIB 纯文本兜底：有些歌只有 plainLyrics 没有同步轴（例：《唤水剑》），也捞回来用 */
  function lrclibPlain(artist, title, dur){
    return lrclibGet(artist, title, dur)
      .then(function(rec){ return (rec && rec.plainLyrics) ? plainToLines(rec.plainLyrics, dur || rec.duration) : null; })
      .catch(function(){
        var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'');
        return fetchT('https://lrclib.net/api/search?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
          .then(function(list){
            var cand=(list||[]).filter(function(x){ return x.plainLyrics && !x.instrumental; });
            if(!cand.length) return null;
            if(dur){
              cand.sort(function(a,b){ return Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur); });
              if(Math.abs((cand[0].duration||0)-dur)>6) return null;
            }
            return plainToLines(cand[0].plainLyrics, dur || cand[0].duration);
          });
      })
      .catch(function(){ return null; });
  }
  /* 歌词来源优先级：本地 .lrc > 本地缓存 > LRCLIB 精确 > LRCLIB 搜索 > LRCLIB 清洗歌名重试 > LRCLIB 纯文本 > lyrics.ovh */
  /* 歌词本地缓存：匹配成功就存浏览器 localStorage，下次进站直接命中、不用再联网等 */
  function lrcCacheGet(meta){
    try{
      var v=localStorage.getItem('unsentLrcV1:'+(meta.artist||'')+'|'+meta.title);
      if(!v) return null;
      var lines=JSON.parse(v);
      return (lines && lines.length) ? lines : null;
    }catch(e){ return null; }
  }
  function lrcCacheSet(meta, lines){
    try{ localStorage.setItem('unsentLrcV1:'+(meta.artist||'')+'|'+meta.title, JSON.stringify(lines)); }catch(e){}
  }
  function loadLyrics(idx){
    var st=lyrState[idx];
    if(st.status==='loading'||st.status==='done') return;
    st.status='loading';
    var meta=songMeta[idx], dur=durations[idx];
    var jobs=[];
    if(meta.lrcFile) jobs.push(fetchText(sourcesFor(encodeURIComponent(meta.lrcFile), mainSha)).then(parseLrc));
    jobs.push(Promise.resolve(lrcCacheGet(meta)));
    jobs.push(
      lrclibGet(meta.artist, meta.title, dur)
        .then(function(rec){ return rec && rec.syncedLyrics ? parseLrc(rec.syncedLyrics) : null; })
        .catch(function(){ return lrclibSearch(meta.artist, meta.title, dur).then(function(rec){ return rec ? parseLrc(rec.syncedLyrics) : null; }); })
        .catch(function(){ return null; })
    );
    var cleaned=cleanTitle(meta.title);
    if(cleaned && cleaned!==meta.title){
      jobs.push(
        lrclibGet(meta.artist, cleaned, dur)
          .then(function(rec){ return rec && rec.syncedLyrics ? parseLrc(rec.syncedLyrics) : null; })
          .catch(function(){ return lrclibSearch(meta.artist, cleaned, dur).then(function(rec){ return rec ? parseLrc(rec.syncedLyrics) : null; }); })
          .catch(function(){ return null; })
      );
    }
    jobs.push(lrclibPlain(meta.artist, meta.title, dur));
    jobs.push(ovhLyrics(meta.artist, meta.title, dur));
    var approxStart=jobs.length-2; /* 最后两档是粗对齐兜底，命中的不进缓存，留机会给精准同步版 */
    (function next(j){
      if(j>=jobs.length){ st.status='done'; st.lines=[]; renderLyrics(); return; }
      jobs[j].then(function(lines){
        if(lines && lines.length){
          st.status='done'; st.lines=lines;
          if(j<approxStart) lrcCacheSet(meta, lines);
          renderLyrics();
        }
        else next(j+1);
      }).catch(function(){ next(j+1); });
    })(0);
  }

  /* ---------------- auto cover (iTunes) ---------------- */
  function norm(s){ return (s||'').toLowerCase().replace(/[\s\u3000·・'"'"'“”‘’()（）\[\]【】\-—_,，.。!！?？:：;；/\\]/g,''); }
  function itunesCover(meta, dur){
    var term=(meta.artist?meta.artist+' ':'')+meta.title;
    var url='https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&media=music&entity=song&limit=8';
    return fetchT(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var res=(data.results||[]).filter(function(x){ return x.artworkUrl100; });
        if(!res.length) return null;
        var pick=null;
        if(dur){
          var inWin=res.filter(function(x){ return Math.abs((x.trackTimeMillis||0)/1000-dur)<=4; });
          if(!inWin.length) return null;
          pick=inWin.filter(function(x){ return norm(x.trackName)===norm(meta.title) && norm(x.artistName)===norm(meta.artist); })[0]
            || inWin.filter(function(x){ return norm(x.trackName)===norm(meta.title); })[0]
            || inWin.filter(function(x){ return norm(x.artistName)===norm(meta.artist); })[0]
            || inWin[0];
        }else{
          pick=res.filter(function(x){ return norm(x.trackName)===norm(meta.title) && norm(x.artistName)===norm(meta.artist); })[0]||null;
        }
        return pick ? pick.artworkUrl100.replace('100x100bb.jpg','600x600bb.jpg') : null;
      });
  }
  function applyCover(idx, url){
    songMeta[idx].cover=url;
    if(ap && ap.list.audios[idx]) ap.list.audios[idx].cover=url;
    if(ap && idx===curIdx){
      var pic=document.querySelector('.aplayer-pic');
      if(pic) pic.style.backgroundImage='url("'+url+'")';
      applyStageBg();
      vinylize();
      tintFromCover(url);
    }
  }
  /* 封面取色：把主色调染进整页氛围（进度条、高亮歌词、月光） */
  function tintFromCover(url){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var cv=document.createElement('canvas'); cv.width=cv.height=24;
        var cx=cv.getContext('2d'); cx.drawImage(img,0,0,24,24);
        var d=cx.getImageData(0,0,24,24).data, r=0,g=0,b=0,w=0;
        for(var i=0;i<d.length;i+=4){
          var R=d[i],G=d[i+1],B=d[i+2];
          var mx=Math.max(R,G,B), mn=Math.min(R,G,B);
          if(mx<28||mx>245) continue;
          var weight=0.35+((mx-mn)/255);
          r+=R*weight; g+=G*weight; b+=B*weight; w+=weight;
        }
        if(!w) return;
        r=Math.round(r/w); g=Math.round(g/w); b=Math.round(b/w);
        /* 莫蘭迪化：向自身灰度靠攏、去飽和，再派生深/淺/底色四檔 */
        var gray=Math.round((r+g+b)/3);
        r=Math.round(r+(gray-r)*0.55); g=Math.round(g+(gray-g)*0.55); b=Math.round(b+(gray-b)*0.55);
        curTint={r:r, g:g, b:b};
        applyVars();
      }catch(e){ /* 取色失败就保留默认夜蓝 */ }
    };
    img.src=url;
  }
  /* 旋转唱片：把封面搬到可旋转的内层上，按钮保持不动 */
  function vinylize(){
    var pic=document.querySelector('.aplayer-pic');
    if(!pic) return;
    var rot=pic.querySelector('.pic-rot');
    if(!rot){
      rot=document.createElement('div'); rot.className='pic-rot';
      pic.insertBefore(rot, pic.firstChild);
    }
    var cov=songMeta[curIdx] && songMeta[curIdx].cover;
    rot.style.backgroundImage = cov ? 'url("'+cov+'")' : 'none';
  }
  function applyStageBg(){
    var bg=document.getElementById('stageBg');
    var cov=songMeta[curIdx] && songMeta[curIdx].cover;
    if(cov){ bg.style.backgroundImage='url("'+cov+'")'; bg.style.opacity='1'; }
    else { bg.style.opacity='0'; }
  }
  /* JSONP 小工具：给不支持 CORS 的国内接口用（脚本标签不受同源限制）
     注意：QQ 搜索接口不认 callback 参数（写了也白写、固定用 callback 包裹），只认 jsonpCallback，
     参数名传错会让回调永远不触发、整条链卡到超时——这是「封面一直加载不出来」的真凶 */
  var jsonpSeq=0;
  function jsonp(url, timeout, cbParam){
    return new Promise(function(res, rej){
      var cb='__unsentCb'+(++jsonpSeq)+'_'+Date.now();
      var sc=document.createElement('script');
      var timer=setTimeout(function(){ cleanup(); rej(new Error('jsonp timeout')); }, timeout||9000);
      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
        if(sc.parentNode) sc.parentNode.removeChild(sc);
      }
      window[cb]=function(data){ cleanup(); res(data); };
      sc.onerror=function(){ cleanup(); rej(new Error('jsonp error')); };
      sc.src=url+(url.indexOf('?')>=0 ? '&' : '?')+(cbParam||'callback')+'='+cb;
      document.head.appendChild(sc);
    });
  }
  /* 首选封面源：QQ音乐（国内直连、华语曲库最全；本地打分+时长把关，图先验真再用） */
  function qqCover(meta, dur){
    var w=(meta.artist ? meta.artist+' ' : '')+meta.title;
    var url='https://c.y.qq.com/soso/fcgi-bin/client_search_cp?format=jsonp&p=1&n=6&aggr=1&lossless=0&flag_qc=0&w='+encodeURIComponent(w);
    return jsonp(url, 9000, 'jsonpCallback').then(function(d){
      var list=(d && d.data && d.data.song && d.data.song.list)||[];
      var scored=list.filter(function(x){ return x.albummid; }).map(function(x, i){
        var s=0;
        if(norm(x.songname||'')===norm(meta.title)) s+=4;
        var singers=(x.singer||[]).map(function(sg){ return sg.name||''; }).join(' ');
        if(meta.artist && norm(meta.artist)){
          if(norm(singers)===norm(meta.artist)) s+=3;
          else if(norm(singers).indexOf(norm(meta.artist))>=0) s+=2;
        }
        return {x:x, s:s, dd: dur ? Math.abs((x.interval||0)-dur) : 0, i:i};
      }).filter(function(o){ return o.s>=4 && (!dur || o.dd<=4); });
      if(!scored.length) return null;
      /* 分数、时长差都相同时，信 QQ 自己的排序（官方版通常排最前，防翻唱/钢琴版同分抢位） */
      scored.sort(function(a,b){ return (b.s-a.s) || (a.dd-b.dd) || (a.i-b.i); });
      var urls=scored.slice(0,2).map(function(o){ return 'https://y.qq.com/music/photo_new/T002R500x500M000'+o.x.albummid+'.jpg'; });
      return verifyImgUrls(urls, 0);
    }).catch(function(){ return null; });
  }
  /* 备用封面源：MusicBrainz 找唱片 + Cover Art Archive 取图（同样用时长把关，防翻唱误配） */
  function mbCover(meta, dur){
    var q='recording:"'+(meta.title||'').replace(/"/g,'')+'"'+(meta.artist?' AND artistname:"'+meta.artist.replace(/"/g,'')+'"':'');
    var url='https://musicbrainz.org/ws/2/recording/?query='+encodeURIComponent(q)+'&fmt=json&limit=10';
    return fetchT(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var recs=(data.recordings||[]).filter(function(x){ return x.releases && x.releases.length; });
        if(!recs.length) return null;
        if(dur){
          recs=recs.filter(function(x){ return x.length && Math.abs(x.length/1000-dur)<=5; });
        }else{
          recs=recs.filter(function(x){
            var ac=(x['artist-credit'] && x['artist-credit'][0] && x['artist-credit'][0].name)||'';
            return norm(x.title)===norm(meta.title) && (!meta.artist || norm(ac)===norm(meta.artist));
          });
        }
        if(!recs.length) return null;
        recs.sort(function(a,b){
          var da=dur ? Math.abs((a.length||0)/1000-dur) : 0, db=dur ? Math.abs((b.length||0)/1000-dur) : 0;
          return da-db || (b.score||0)-(a.score||0);
        });
        var ids=[];
        recs.slice(0,3).forEach(function(x){ var id=x.releases[0] && x.releases[0].id; if(id && ids.indexOf(id)<0) ids.push(id); });
        return tryCaa(ids, 0);
      })

  function loadCover(idx, withDur){

    qqCover(meta, dur)
      .then(function(url){ return url || itunesCover(meta, dur).catch(function(){ return null; }); })
      .then(function(url){ return url || mbCover(meta, dur); })

      while(lo2<=hi2){ var md=(lo2+hi2)>>1; if(st.lines[md].t<=t){ li=md; lo2=md+1; } else hi2=md-1; }
      var nextT = li+1<st.lines.length ? st.lines[li+1].t : Infinity;

  (function(){
    var seg=document.getElementById('langSeg');
    var lang='simp';
    try{ lang=localStorage.getItem('unsentLang')||'simp'; }catch(e){}
    if(lang!=='trad') lang='simp';
    var conv=null, convLoading=false;
    function T(s){
      if(lang==='trad' && conv && typeof s==='string'){ try{ return conv(s); }catch(e){ return s; } }
      return s;

    window.T=T;
    function mark(){
      if(!seg) return;
      var bs=seg.querySelectorAll('button');

    /* 静态文案的文本节点 walker：只碰页眉设定区、全屏顶栏、副标题、标题、页脚与全屏按钮；

       #setBtnSum 由设定面板自己经 T() 维护，walker 跳过免得还原时串字 */
    var savedTexts=new Map();

      if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      var p=node.parentElement;
      if(p && p.id==='setBtnSum') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
    function collectTexts(root){
      var out=[], walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, nodeFilter), n;
      while((n=walker.nextNode())) out.push(n);

      var sb=document.querySelector('.sub'); if(sb) roots.push(sb);

  function listViaJsdelivr(){

          if(f.name.indexOf(prefix)!==0) return;
          var rest=f.name.slice(prefix.length);
          if(rest && rest.indexOf('/')<0) names.push({name:rest, size:f.size||0});
        });
        if(!names.length) throw new Error('empty');
        return names;
      });
  }
  function listViaGithub(){
    return gh(API+'/contents/'+DIR)
      .then(function(r){ if(!r.ok) throw new Error('list '+r.status); return r.json(); })
      .then(function(items){
        return (items||[]).filter(function(i){return i.type==='file';}).map(function(i){return {name:i.name, size:i.size||0};});
      });
  }
  /* 两边清单取并集：jsDelivr 不限流但索引更新慢（新歌要等它刷新）；
     GitHub 实时但有匿名限额。并集让新歌立刻出现，GitHub 被限流时还有 jsDelivr 兜底 */
  function settle(p){ return p.then(function(v){ return {ok:true, v:v}; }, function(){ return {ok:false}; }); }
  var listPromise=Promise.all([settle(listViaJsdelivr()), settle(listViaGithub())])
    .then(function(rs){
      var seen={}, names=[];
      rs.forEach(function(r){
        if(!r.ok) return;
        (r.v||[]).forEach(function(it){
          if(!it || !it.name) return;
          if(!seen[it.name]){ seen[it.name]=it; names.push(it); }
          else if(!seen[it.name].size && it.size) seen[it.name].size=it.size; /* 两路并集时把文件大小也带上，大文件分流要用 */
        });
      });
      if(!names.length) throw new Error('no list');
      return names;
    });
  Promise.all([
    listPromise,
    gh(API+'/branches/main').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
  ])
    .then(function(res){
      mainSha=res[1] && res[1].commit && res[1].commit.sha;
      var files=res[0];
      var covers={}, lrcFiles={};
      files.forEach(function(f){
        var e=ext(f.name);
        if(IMG.indexOf(e)>=0) covers[base(f.name)]=CDN+encodeURIComponent(f.name);
        if(e==='lrc') lrcFiles[base(f.name)]=f.name;
      });
      var songs=files.filter(function(f){return AUDIO.indexOf(ext(f.name))>=0;})
        .sort(function(a,b){return a.name.localeCompare(b.name,'zh');})
        .map(function(f){
          var b=base(f.name), nm=splitName(b);
          var srcs=sourcesFor(encodeURIComponent(f.name), mainSha, (f.size||0) >= 20*1024*1024);
          songSources.push(srcs);
          songMeta.push({artist:nm.artist, title:nm.title, file:b, lrcFile:lrcFiles[b]||null, cover:covers[b]||null});
          lyrState.push({status:'idle', lines:null});
          coverState.push({done:!!covers[b], triedNoDur:false, triedDur:false});
          var s={name:nm.title, artist:nm.artist||'by0628', url:srcs[0]};
          if(covers[b]) s.cover=covers[b];
          return s;
        });
      if(!songs.length){
        statusEl.textContent=T('歌单还空着——第一首歌，正在来的路上。');
        return;
      }
      statusEl.textContent=T('共 '+songs.length+' 首 · 点开任意一首开始');
      ap=new APlayer({
        container:document.getElementById('player'),
        audio:songs, theme:'#7d8b96', lrcType:0,
        listFolded:false, preload:'metadata', volume:0.85, mutex:true
      });
      /* 当前线路报错就自动顺延到下一条，直到能播为止 */
      var attempts={};
      ap.audio.addEventListener('error', function(){
        var i=ap.list.index, srcs=songSources[i];
        if(!srcs) return;
        var next=(attempts[i]||0)+1;
        if(next>=srcs.length) return;
        attempts[i]=next;
        var resume=!ap.audio.paused;
        ap.list.audios[i].url=srcs[next];
        ap.audio.src=srcs[next];
        if(resume) ap.play();
      });
      ap.audio.addEventListener('loadedmetadata', function(){
        durations[ap.list.index]=ap.audio.duration;
        var drow=groupsEl ? groupsEl.querySelector('.grp-row[data-gi="'+ap.list.index+'"] .dur') : null;
        if(drow) drow.textContent=fmtDur(ap.audio.duration);
        loadLyrics(ap.list.index);
        loadCover(ap.list.index, true);
      });
      ap.on('listswitch', function(e){
        curIdx=e.index; curLine=-1;
        markGroupCurrent();
        stageTitle.textContent=T(songMeta[curIdx] ? (songMeta[curIdx].artist ? songMeta[curIdx].artist+' - ' : '')+songMeta[curIdx].title : '');
        if(window.refreshLangDOM) window.refreshLangDOM();
        renderLyrics();
        loadLyrics(curIdx);
        if(coverState[curIdx] && !coverState[curIdx].done && !(songMeta[curIdx] && songMeta[curIdx].cover)){
          /* 还没有真封面：每次切到这首都重查一次线上源，不让任何一次网络失败定终身 */
          coverState[curIdx].triedDur=false;
          loadCover(curIdx, true);
        }else{
          loadCover(curIdx, false);
        }
        vinylize();
        if(songMeta[curIdx].cover) tintFromCover(songMeta[curIdx].cover); else resetTint();
        applyStageBg();
      });
      buildGroups();
      preloadAll();
      stageTitle.textContent=T((songMeta[0].artist ? songMeta[0].artist+' - ' : '')+songMeta[0].title);
      stageBtn.style.display='block';
      loadCover(0, false);
      applyStageBg();
      vinylize();
      ap.on('play', function(){
        document.body.classList.add('playing');
      });
      ap.on('pause', function(){ document.body.classList.remove('playing'); });
      /* 等元数据给出时长再匹配歌词更准；3.5 秒还没等到就先直接查 */
      setTimeout(function(){ loadLyrics(ap.list.index); }, 3500);
    })
    .catch(function(){
      statusEl.textContent=T('歌单暂时没打开（网络或接口限流），刷新一次试试。');
    });

})();
</script>
