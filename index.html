<script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
<script>
(function(){
  var OWNER='by0628', REPO='Music', DIR='songs';
  var CDN='https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@main/'+DIR+'/';
  var AUDIO=['mp3','m4a','wav','ogg','oga','flac','aac','opus'];
  var IMG=['jpg','jpeg','png','webp'];
  var statusEl=document.getElementById('status');

  function ext(name){ var m=name.toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:''; }
  function base(name){ return name.replace(/\.[^.]+$/,''); }
  /* "歌手 - 歌名" 拆分；拆不出就整名当歌名 */
  function splitName(b){
    var i=b.indexOf(' - ');
    if(i>0) return {artist:b.slice(0,i).trim(), title:b.slice(i+3).trim()};
    i=b.indexOf('-');
    if(i>0) return {artist:b.slice(0,i).trim(), title:b.slice(i+1).trim()};
    return {artist:'', title:b};
  }

  var API='https://api.github.com/repos/'+OWNER+'/'+REPO;
  function gh(url){ return fetch(url,{headers:{'Accept':'application/vnd.github+json'}}); }
  /* 每首歌准备多条线路，一条不通自动换下一条 */
  function sourcesFor(enc, sha){
    var list=[];
    if(sha) list.push('https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@'+sha+'/'+DIR+'/'+enc);
    list.push('https://cdn.jsdelivr.net/gh/'+OWNER+'/'+REPO+'@main/'+DIR+'/'+enc);
    list.push('https://cdn.statically.io/gh/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc);
    list.push('https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/'+DIR+'/'+enc);
    list.push(DIR+'/'+enc);
    return list;
  }

  /* ---------------- lyrics engine ---------------- */
  function parseLrc(text){
    var out=[];
    (text||'').split(/\r?\n/).forEach(function(line){
      var tags=line.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/g);
      if(!tags) return;
      var txt=line.replace(/\[[^\]]*\]/g,'').trim();
      tags.forEach(function(tag){
        var m=tag.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/);
        out.push({t:parseInt(m[1],10)*60+parseFloat(m[2]), text:txt});
      });
    });
    out.sort(function(a,b){return a.t-b.t;});
    return out.filter(function(l){return l.text;});
  }
  function fetchText(urls){
    var chain=Promise.reject();
    urls.forEach(function(u){
      chain=chain.catch(function(){
        return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); });
      });
    });
    return chain;
  }
  function lrclibGet(artist,title,dur){
    var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'')+(dur?'&duration='+Math.round(dur):'');
    return fetch('https://lrclib.net/api/get?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function lrclibSearch(artist,title,dur){
    var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'');
    return fetch('https://lrclib.net/api/search?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(list){
        var cand=(list||[]).filter(function(x){ return x.syncedLyrics && !x.instrumental; });
        if(!cand.length) return null;
        if(dur){
          cand.sort(function(a,b){ return Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur); });
          if(Math.abs((cand[0].duration||0)-dur)>6) return null;
        }
        return cand[0];
      });
  }
  /* 歌词来源优先级：本地 .lrc > LRCLIB 精确匹配 > LRCLIB 搜索 */
  function loadLyrics(idx){
    var st=lyrState[idx];
    if(st.status==='loading'||st.status==='done') return;
    st.status='loading';
    var meta=songMeta[idx], dur=durations[idx];
    var jobs=[];
    if(meta.lrcFile) jobs.push(fetchText(sourcesFor(encodeURIComponent(meta.lrcFile), mainSha)).then(parseLrc));
    jobs.push(
      lrclibGet(meta.artist, meta.title, dur)
        .then(function(rec){ return rec && rec.syncedLyrics ? parseLrc(rec.syncedLyrics) : null; })
        .catch(function(){ return lrclibSearch(meta.artist, meta.title, dur).then(function(rec){ return rec ? parseLrc(rec.syncedLyrics) : null; }); })
        .catch(function(){ return null; })
    );
    (function next(j){
      if(j>=jobs.length){ st.status='done'; st.lines=[]; renderLyrics(); return; }
      jobs[j].then(function(lines){
        if(lines && lines.length){ st.status='done'; st.lines=lines; renderLyrics(); }
        else next(j+1);
      }).catch(function(){ next(j+1); });
    })(0);
  }

  /* ---------------- auto cover (iTunes) ---------------- */
  function norm(s){ return (s||'').toLowerCase().replace(/[\s\u3000·・'"'"'“”‘’()（）\[\]【】\-—_,，.。!！?？:：;；/\\]/g,''); }
  function itunesCover(meta, dur){
    var term=(meta.artist?meta.artist+' ':'')+meta.title;
    var url='https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&media=music&entity=song&limit=8';
    return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var res=(data.results||[]).filter(function(x){ return x.artworkUrl100; });
        if(!res.length) return null;
        var pick=null;
        if(dur){
          var inWin=res.filter(function(x){ return Math.abs((x.trackTimeMillis||0)/1000-dur)<=4; });
          if(!inWin.length) return null;
          pick=inWin.filter(function(x){ return norm(x.trackName)===norm(meta.title); })[0]
            || inWin.filter(function(x){ return norm(x.artistName)===norm(meta.artist); })[0]
            || inWin[0];
        }else{
          pick=res.filter(function(x){ return norm(x.trackName)===norm(meta.title) && norm(x.artistName)===norm(meta.artist); })[0]||null;
        }
        return pick ? pick.artworkUrl100.replace('100x100bb.jpg','600x600bb.jpg') : null;
      });
  }
  function applyCover(idx, url){
    songMeta[idx].cover=url;
    if(ap && ap.list.audios[idx]) ap.list.audios[idx].cover=url;
    if(ap && idx===curIdx){
      var pic=document.querySelector('.aplayer-pic');
      if(pic) pic.style.backgroundImage='url("'+url+'")';
      applyStageBg();
      vinylize();
      tintFromCover(url);
    }
  }
  /* 封面取色：把主色调染进整页氛围（进度条、高亮歌词、月光） */
  function tintFromCover(url){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var cv=document.createElement('canvas'); cv.width=cv.height=24;
        var cx=cv.getContext('2d'); cx.drawImage(img,0,0,24,24);
        var d=cx.getImageData(0,0,24,24).data, r=0,g=0,b=0,w=0;
        for(var i=0;i<d.length;i+=4){
          var R=d[i],G=d[i+1],B=d[i+2];
          var mx=Math.max(R,G,B), mn=Math.min(R,G,B);
          if(mx<28||mx>245) continue;
          var weight=0.35+((mx-mn)/255);
          r+=R*weight; g+=G*weight; b+=B*weight; w+=weight;
        }
        if(!w) return;
        r=Math.round(r/w); g=Math.round(g/w); b=Math.round(b/w);
        /* 向夜色靠拢，避免荧光色破坏气质 */
        r=Math.round(r*0.72+24); g=Math.round(g*0.72+30); b=Math.round(b*0.72+52);
        var root=document.documentElement.style;
        root.setProperty('--accent','rgb('+r+','+g+','+b+')');
        var lr=Math.round(r+(255-r)*0.36), lg=Math.round(g+(255-g)*0.36), lb=Math.round(b+(255-b)*0.36);
        root.setProperty('--accent-l','rgb('+lr+','+lg+','+lb+')');
      }catch(e){ /* 取色失败就保留默认夜蓝 */ }
    };
    img.src=url;
  }
  /* 旋转唱片：把封面搬到可旋转的内层上，按钮保持不动 */
  function vinylize(){
    var pic=document.querySelector('.aplayer-pic');
    if(!pic) return;
    var rot=pic.querySelector('.pic-rot');
    if(!rot){
      rot=document.createElement('div'); rot.className='pic-rot';
      pic.insertBefore(rot, pic.firstChild);
    }
    var cov=songMeta[curIdx] && songMeta[curIdx].cover;
    rot.style.backgroundImage = cov ? 'url("'+cov+'")' : 'none';
  }
  function applyStageBg(){
    var bg=document.getElementById('stageBg');
    var cov=songMeta[curIdx] && songMeta[curIdx].cover;
    if(cov){ bg.style.backgroundImage='url("'+cov+'")'; bg.style.opacity='1'; }
    else { bg.style.opacity='0'; }
  }
  function loadCover(idx, withDur){
    var st=coverState[idx];
    if(!st || st.done) return;
    if(withDur ? st.triedDur : st.triedNoDur) return;
    if(withDur) st.triedDur=true; else st.triedNoDur=true;
    itunesCover(songMeta[idx], withDur ? durations[idx] : null)
      .then(function(url){ if(url){ st.done=true; applyCover(idx, url); } })
      .catch(function(){});
  }

  var songMeta=[], songSources=[], lyrState=[], durations={}, coverState=[];
  var ap=null, curIdx=0, curLine=-1;

  var lrcPanel=document.getElementById('lrcPanel'), lrcScroll=document.getElementById('lrcScroll'),
      lrcNote=document.getElementById('lrcNote'), stageBtn=document.getElementById('stageBtn'),
      stage=document.getElementById('stage'), stageScroll=document.getElementById('stageScroll'),
      stageNote=document.getElementById('stageNote'), stageTitle=document.getElementById('stageTitle'),
      stageBarFill=document.getElementById('stageBarFill');

  function buildLines(container, lines){
    container.innerHTML='';
    lines.forEach(function(l,i){
      var p=document.createElement('p');
      p.textContent=l.text;
      p.addEventListener('click', function(){ if(ap){ ap.audio.currentTime=l.t+0.01; ap.play(); } });
      container.appendChild(p);
    });
  }
  function renderLyrics(){
    var st=lyrState[curIdx];
    curLine=-1;
    if(!st || st.status!=='done'){ lrcPanel.style.display='none'; lrcNote.style.display='none'; stageNote.style.display='none'; return; }
    if(!st.lines.length){
      lrcPanel.style.display='none';
      lrcNote.textContent='这首歌还没有歌词 · 纯享旋律';
      lrcNote.style.display='block';
      stageNote.style.display='flex';
      stageScroll.innerHTML='';
      return;
    }
    lrcNote.style.display='none'; stageNote.style.display='none';
    buildLines(lrcScroll, st.lines);
    buildLines(stageScroll, st.lines);
    lrcPanel.style.display='block';
    syncLyrics(true);
  }
  function centerLine(container, wrap, i){
    var el=container.children[i]; if(!el) return;
    var y=el.offsetTop - wrap.clientHeight/2 + el.clientHeight/2;
    container.style.transform='translateY('+(-y)+'px)';
  }
  function syncLyrics(force){
    if(!ap) return;
    var st=lyrState[curIdx];
    var t=ap.audio.currentTime||0, d=ap.audio.duration||0;
    if(d>0) stageBarFill.style.width=(t/d*100)+'%';
    /* 间奏呼吸点：离下一句还远、且当前句已唱完一会儿时显示 */
    var dotsOn=false;
    if(st && st.lines && st.lines.length){
      var li=-1, lo2=0, hi2=st.lines.length-1;
      while(lo2<=hi2){ var md=(lo2+hi2)>>1; if(st.lines[md].t<=t){ li=md; lo2=md+1; } else hi2=md-1; }
      var nextT = li+1<st.lines.length ? st.lines[li+1].t : Infinity;
      if(li===-1) dotsOn = t < st.lines[0].t-1.2;
      else dotsOn = (nextT-t>6) && (t>st.lines[li].t+3.5);
    }
    document.getElementById('panelDots').classList.toggle('on', dotsOn);
    document.getElementById('stageDots').classList.toggle('on', dotsOn);
    updatePulse();
    if(!st || !st.lines || !st.lines.length) return;
    var lo=0, hi=st.lines.length-1, idx=-1;
    while(lo<=hi){ var mid=(lo+hi)>>1; if(st.lines[mid].t<=t){ idx=mid; lo=mid+1; } else hi=mid-1; }
    if(idx===curLine && !force) return;
    curLine=idx;
    [lrcScroll, stageScroll].forEach(function(container){
      for(var i=0;i<container.children.length;i++){
        var el=container.children[i];
        el.className = i===idx ? 'cur' : (Math.abs(i-idx)<=2 ? 'near' : '');
      }
    });
    if(idx>=0){
      centerLine(lrcScroll, lrcPanel, idx);
      centerLine(stageScroll, document.getElementById('stageBody'), idx);
    }
  }
  setInterval(function(){ syncLyrics(false); }, 200);

  /* ---------- 律动光晕 ---------- */
  var actx=null, analyser=null, vizOn=false, pulseLvl=0;
  function initViz(){
    if(vizOn || !ap) return;
    if((ap.audio.src||'').indexOf('cdn.jsdelivr.net')<0) return; /* 只在跨域头齐全的主线路接分析 */
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      actx=new AC();
      var srcNode=actx.createMediaElementSource(ap.audio);
      analyser=actx.createAnalyser();
      analyser.fftSize=64;
      srcNode.connect(analyser);
      analyser.connect(actx.destination);
      vizOn=true;
    }catch(e){ /* 分析接不上就不接，不影响播放 */ }
  }
  function updatePulse(){
    if(!vizOn || !analyser || !actx) return;
    var arr=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(arr);
    var sum=0, n=8;
    for(var i=1;i<=n;i++) sum+=arr[i];
    var target=Math.min(1,(sum/n)/190);
    pulseLvl += (target-pulseLvl)*0.35;
    var moon=document.querySelector('.moon');
    if(moon) moon.style.transform='scale('+(1+pulseLvl*0.08).toFixed(3)+')';
    var bg=document.getElementById('stageBg');
    if(bg) bg.style.transform='scale('+(1.03+pulseLvl*0.05).toFixed(3)+')';
  }
  function resetTint(){
    var root=document.documentElement.style;
    root.setProperty('--accent','#8fa8d8');
    root.setProperty('--accent-l','#c7d5f2');
  }

  /* ---------- 全屏样式切换 ---------- */
  (function(){
    var seg=document.getElementById('stageSeg'), stageEl=document.getElementById('stage');
    var saved='classic';
    try{ saved=localStorage.getItem('unsentStageStyle')||'classic'; }catch(e){}
    function applyStyle(name){
      stageEl.classList.remove('style-drift','style-single');
      if(name!=='classic') stageEl.classList.add('style-'+name);
      var btns=seg.querySelectorAll('button');
      for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-style')===name);
      try{ localStorage.setItem('unsentStageStyle', name); }catch(e){}
      syncLyrics(true);
    }
    seg.addEventListener('click', function(e){
      var b=e.target.closest ? e.target.closest('button') : null;
      if(b) applyStyle(b.getAttribute('data-style'));
    });
    applyStyle(saved);
  })();

  stageBtn.addEventListener('click', function(){
    stage.classList.add('open'); document.body.style.overflow='hidden'; syncLyrics(true);
  });
  function closeStage(){ stage.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('stageClose').addEventListener('click', closeStage);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeStage(); });

  /* ---------------- playlist ---------------- */
  var mainSha=null;
  /* 歌单优先走 jsDelivr 的文件清单接口（CDN 侧、不限流）；
     GitHub 接口有每小时 60 次的匿名限额、且共用出口 IP 时容易被别人耗尽，只作兜底 */
  function listViaJsdelivr(){
    return fetch('https://data.jsdelivr.com/v1/packages/gh/'+OWNER+'/'+REPO+'@main?structure=flat')
      .then(function(r){ if(!r.ok) throw new Error('jsd '+r.status); return r.json(); })
      .then(function(d){
        var names=[];
        (d.files||[]).forEach(function(f){
          var prefix='/'+DIR+'/';
          if(f.name.indexOf(prefix)!==0) return;
          var rest=f.name.slice(prefix.length);
          if(rest && rest.indexOf('/')<0) names.push(rest);
        });
        if(!names.length) throw new Error('empty');
        return names;
      });
  }
  function listViaGithub(){
    return gh(API+'/contents/'+DIR)
      .then(function(r){ if(!r.ok) throw new Error('list '+r.status); return r.json(); })
      .then(function(items){
        return (items||[]).filter(function(i){return i.type==='file';}).map(function(i){return i.name;});
      });
  }
  var listPromise=listViaJsdelivr().catch(function(){ return listViaGithub(); });
  Promise.all([
    listPromise,
    gh(API+'/branches/main').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; })
  ])
    .then(function(res){
      var fileNames=res[0];
      mainSha=res[1] && res[1].commit && res[1].commit.sha;
      var files=fileNames.map(function(n){ return {name:n}; });
      var covers={}, lrcFiles={};
      files.forEach(function(f){
        var e=ext(f.name);
        if(IMG.indexOf(e)>=0) covers[base(f.name)]=CDN+encodeURIComponent(f.name);
        if(e==='lrc') lrcFiles[base(f.name)]=f.name;
      });
      var songs=files.filter(function(f){return AUDIO.indexOf(ext(f.name))>=0;})
        .sort(function(a,b){return a.name.localeCompare(b.name,'zh');})
        .map(function(f){
          var b=base(f.name), nm=splitName(b);
          var srcs=sourcesFor(encodeURIComponent(f.name), mainSha);
          songSources.push(srcs);
          songMeta.push({artist:nm.artist, title:nm.title, file:b, lrcFile:lrcFiles[b]||null, cover:covers[b]||null});
          lyrState.push({status:'idle', lines:null});
          coverState.push({done:!!covers[b], triedNoDur:false, triedDur:false});
          var s={name:nm.title, artist:nm.artist||'by0628', url:srcs[0]};
          if(covers[b]) s.cover=covers[b];
          return s;
        });
      if(!songs.length){
        statusEl.textContent='歌单还空着——第一首歌，正在来的路上。';
        return;
      }
      statusEl.textContent='共 '+songs.length+' 首 · 点开任意一首开始';
      ap=new APlayer({
        container:document.getElementById('player'),
        audio:songs, theme:'#8fa8d8', lrcType:0,
        listFolded:false, preload:'metadata', volume:0.85, mutex:true
      });
      /* 当前线路报错就自动顺延到下一条，直到能播为止 */
      var attempts={};
      ap.audio.addEventListener('error', function(){
        var i=ap.list.index, srcs=songSources[i];
        if(!srcs) return;
        var next=(attempts[i]||0)+1;
        if(next>=srcs.length) return;
        attempts[i]=next;
        var resume=!ap.audio.paused;
        ap.list.audios[i].url=srcs[next];
        ap.audio.src=srcs[next];
        if(resume) ap.play();
      });
      ap.audio.addEventListener('loadedmetadata', function(){
        durations[ap.list.index]=ap.audio.duration;
        loadLyrics(ap.list.index);
        loadCover(ap.list.index, true);
      });
      ap.on('listswitch', function(e){
        curIdx=e.index; curLine=-1;
        stageTitle.textContent=songMeta[curIdx] ? (songMeta[curIdx].artist ? songMeta[curIdx].artist+' - ' : '')+songMeta[curIdx].title : '';
        renderLyrics();
        loadLyrics(curIdx);
        loadCover(curIdx, false);
        vinylize();
        if(songMeta[curIdx].cover) tintFromCover(songMeta[curIdx].cover); else resetTint();
        applyStageBg();
      });
      stageTitle.textContent=(songMeta[0].artist ? songMeta[0].artist+' - ' : '')+songMeta[0].title;
      stageBtn.style.display='block';
      loadCover(0, false);
      applyStageBg();
      vinylize();
      ap.on('play', function(){
        document.body.classList.add('playing');
        initViz();
        if(actx && actx.state==='suspended') actx.resume();
      });
      ap.on('pause', function(){ document.body.classList.remove('playing'); });
      /* 等元数据给出时长再匹配歌词更准；3.5 秒还没等到就先直接查 */
      setTimeout(function(){ loadLyrics(ap.list.index); }, 3500);
    })
    .catch(function(){
      statusEl.textContent='歌单暂时没打开（网络或接口限流），刷新一次试试。';
    });

  /* gentle rain */
  var c=document.getElementById('rain'), x=c.getContext('2d'), W, H, drops=[];
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); addEventListener('resize', resize);
  for(var i=0;i<70;i++) drops.push({x:Math.random()*2000, y:Math.random()*1200, l:10+Math.random()*16, s:6+Math.random()*7});
  (function tick(){
    x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(170,195,235,.28)'; x.lineWidth=1; x.beginPath();
    drops.forEach(function(d){
      x.moveTo(d.x,d.y); x.lineTo(d.x-1.5,d.y+d.l);
      d.y+=d.s; d.x-=0.6;
      if(d.y>H){ d.y=-20; d.x=Math.random()*(W+100); }
    });
    x.stroke();
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
