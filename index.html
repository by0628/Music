  #setShield{position:fixed;inset:0;z-index:29;display:none}
  #setShield.on{display:block}
  #ctlWrap{position:relative;display:flex;justify-content:center;margin-top:26px;z-index:30}
  #setBtn{background:var(--card);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);
    border:1px solid var(--glass-brd);color:var(--ink-dim);border-radius:999px;
    padding:8px 18px;font-family:inherit;font-size:12.5px;letter-spacing:.25em;cursor:pointer;
    transition:color var(--t-micro) var(--ease-in),border-color var(--t-micro) var(--ease-in),transform var(--t-micro) var(--ease-in);
    box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow)}
  #setBtn:hover{color:var(--ink)}
  #setBtnSum{color:var(--ink-faint);letter-spacing:.12em}
  #setPanel{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,8px);
    width:min(92vw,368px);background:var(--card);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
    padding:4px 20px 8px;text-align:left;opacity:0;pointer-events:none;filter:blur(4px);
    transition:opacity var(--t-exit) var(--ease-out),transform var(--t-exit) var(--ease-out),filter var(--t-exit) var(--ease-out);z-index:31}
  #setPanel.open{opacity:1;pointer-events:auto;transform:translate(-50%,0);filter:blur(0);
    transition:opacity var(--t-enter) var(--ease-in),transform var(--t-enter) var(--ease-in),filter var(--t-enter) var(--ease-in)}
  /* 面板里各组依次出现，延迟 60ms 递增 */
  #setPanel.open .set-group{animation:mistIn var(--t-enter) var(--ease-in) both}
  #setPanel.open .set-group:nth-child(1){animation-delay:0ms}
  #setPanel.open .set-group:nth-child(2){animation-delay:60ms}
  #setPanel.open .set-group:nth-child(3){animation-delay:120ms}
  #setPanel.open .set-group:nth-child(4){animation-delay:180ms}
  #setPanel.open .set-group:nth-child(5){animation-delay:240ms}
  .set-group{padding:12px 0;border-bottom:1px solid var(--line)}
  .set-group:last-child{border-bottom:none}
  .set-lab{font-size:11px;letter-spacing:.4em;color:var(--ink-dim);margin-bottom:9px}
  /* stage: single-line mode */
  #stage.style-single #stageScroll p{visibility:hidden;opacity:0;filter:none}
  #stage.style-single #stageScroll p.near{visibility:visible;opacity:.5;font-size:clamp(calc(14px * var(--fs)),calc(2.4vw * var(--fs)),calc(18px * var(--fs)));color:var(--ink-dim)}
  #stage.style-single #stageScroll p.cur{visibility:visible;opacity:1;color:var(--accent-d);
    font-size:clamp(calc(30px * var(--fs)),calc(6.4vw * var(--fs)),calc(46px * var(--fs)))}
  /* stage: drift mode */
  #stage.style-drift #stageScroll p{transition:font-size 1.15s cubic-bezier(.22,.8,.3,1),color 1.15s,opacity 1.15s,filter 1.15s,transform 1.15s,letter-spacing 1.15s}
  #stage.style-drift #stageScroll p:nth-child(odd){transform:translateX(-7px)}
  #stage.style-drift #stageScroll p:nth-child(even){transform:translateX(7px)}
  #stage.style-drift #stageScroll p.cur{transform:translateY(-4px);letter-spacing:.2em}
  /* stage: tide mode — lines swell like a tide as they approach */
  #stage.style-tide #stageScroll p{transform:scale(.93);opacity:.38;transition:font-size .9s cubic-bezier(.22,.8,.3,1),color .9s,opacity .9s,filter .9s,transform .9s,letter-spacing .9s}
  #stage.style-tide #stageScroll p.near{transform:scale(1.03);opacity:.8}
  #stage.style-tide #stageScroll p.cur{transform:scale(1.12);opacity:1}
  /* stage: cinema mode — one subtitle line, low and wide */
  #stage.style-cinema #stageScroll p{visibility:hidden;opacity:0;filter:none}
  #stage.style-cinema #stageScroll p.cur{visibility:visible;opacity:1;color:var(--accent-d);
    font-size:clamp(calc(25px * var(--fs)),calc(5.6vw * var(--fs)),calc(40px * var(--fs)));letter-spacing:.26em;border-top:1px solid var(--accent);padding-top:20px}
  /* stage: paper mode — printed page, left aligned, accent underline */
  #stage.style-paper #stageScroll{text-align:left;padding-left:9vw;padding-right:9vw}
  #stage.style-paper #stageScroll p{filter:none;opacity:.48;line-height:2.3}
  #stage.style-paper #stageScroll p.near{opacity:.78;filter:none}
  #stage.style-paper #stageScroll p.cur{opacity:1;filter:none;text-decoration:underline;
    text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:7px}
  /* ---------- 美化：入场动画与细节 ---------- */
  ::selection{background:var(--accent-l);color:var(--ink)}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
  .kicker{animation:rise .8s cubic-bezier(.22,.8,.3,1) both}
  h1{animation:rise .8s .07s cubic-bezier(.22,.8,.3,1) both}
  .sub{animation:rise .8s .14s cubic-bezier(.22,.8,.3,1) both}
  #ctlWrap{animation:rise .8s .21s cubic-bezier(.22,.8,.3,1) both}
  .rule{animation:rise .8s .28s cubic-bezier(.22,.8,.3,1) both}
  #player{animation:rise .9s .3s cubic-bezier(.22,.8,.3,1) both}
  /* 歌单在骨架屏淡出到一半时开始淡入（重叠约 32%），绝不出现空白 */
  #groups{animation:mistIn var(--t-enter) var(--ease-in) 380ms both}
  #lrcPanel{animation:mistIn var(--t-enter) var(--ease-in) both}
  .aplayer,#groups{transition:transform var(--t-micro) var(--ease-in),box-shadow var(--t-micro) var(--ease-in)}
  @media (hover:hover){ .aplayer:hover,#groups:hover{transform:translateY(-2px)} }
  .grp-row:active{transform:scale(.99)}
  .grp-row{transition:background var(--t-micro) var(--ease-in),color var(--t-micro) var(--ease-in),transform var(--t-micro) var(--ease-in);
    animation:mistIn var(--t-enter) var(--ease-in) both;animation-delay:calc(var(--i,0)*60ms)}
  /* 封面氛围背景：当前封面虚化铺满整页，随歌交叉淡入（无真封面时自动隐去，保持雾面） */
  #ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .amb-layer{position:absolute;inset:-70px;background-size:cover;background-position:center;filter:var(--stagebg-filter);opacity:0;
    transition:opacity 1.8s var(--ease-in)}
  /* 新层延迟 0.9s 才淡入，旧层已淡出一半，重叠 50%，不出现黑场 */
  .amb-layer.on{opacity:.6;transition-delay:.9s}
  :root[data-theme="dark"] .amb-layer.on{opacity:.5}
  #ambient::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--wash) 30%,transparent),color-mix(in srgb,var(--wash2) 58%,transparent))}
  /* 歌词扫光：当前行按演唱进度从左到右点亮。
     ① 不用 color-mix()——老安卓 WebView / 部分国产内核不认它，整条 background-image 会被丢弃，
        再叠加 -webkit-text-fill-color:transparent 就会让当前行彻底透明，这正是机主手机上看不到扫光的主因。
     ② 未点亮色用固定 rgba(--sweep-dim)，点亮色用 --accent-d，只依赖 var(--p) 百分比。
     ③ --p 默认 0%（不是 100%）：新歌词行还没被扫光逻辑写到时不会整行全亮、看不出变化。 */
  #lrcScroll p.cur,#stageScroll p.cur{
    background-image:linear-gradient(90deg,var(--accent-d) 0,var(--accent-d) var(--p,0%),var(--sweep-dim) var(--p,0%),var(--sweep-dim) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent-d)}
  /* 老内核不支持 background-clip:text 时退回纯色，绝不让当前行消失 */
  @supports not ((-webkit-background-clip:text) or (background-clip:text)){
    #lrcScroll p.cur,#stageScroll p.cur{background-image:none;-webkit-text-fill-color:currentColor}
  }
  /* 全屏 6 种舞台样式里的 color / visibility / filter 规则不得盖掉扫光：
     用同等及以上特异性把 .cur 的渐变与透明填充重新钉死，
     style-paper 原先的 background-image:none / currentColor 已移除（下划线等原设计保留）。 */
  #stage.style-single #stageScroll p.cur,
  #stage.style-drift #stageScroll p.cur,
  #stage.style-tide #stageScroll p.cur,
  #stage.style-cinema #stageScroll p.cur,
  #stage.style-paper #stageScroll p.cur{
    -webkit-text-fill-color:transparent;
    background-image:linear-gradient(90deg,var(--accent-d) 0,var(--accent-d) var(--p,0%),var(--sweep-dim) var(--p,0%),var(--sweep-dim) 100%)}

  /* ================= 雾：新增组件 ================= */
  @keyframes mistIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
  @keyframes mistOut{from{opacity:1;transform:translateY(0);filter:blur(0)}to{opacity:0;transform:translateY(8px);filter:blur(4px)}}
  @keyframes coverHalo{from{opacity:.25;transform:scale(.98)}to{opacity:.45;transform:scale(1.02)}}
  @keyframes skBreath{from{opacity:.20}to{opacity:.42}}
  .mist-in{animation:mistIn var(--t-enter) var(--ease-in) both}
  .mist-out{animation:mistOut var(--t-exit) var(--ease-out) both}

  /* 每日一首：一张克制的小卡，不是横幅 */
  #dailyCard{display:flex;align-items:baseline;gap:14px;width:fit-content;max-width:100%;margin:14px auto 0;padding:8px 20px;background:var(--card);
    backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
    border:1px solid var(--glass-brd);border-radius:999px;color:var(--ink-dim);font-family:inherit;
    box-shadow:inset 0 1px 0 var(--glass-hi);cursor:pointer;
    animation:mistIn var(--t-enter) var(--ease-in) 280ms both;
    transition:color var(--t-micro) var(--ease-in),border-color var(--t-micro) var(--ease-in),transform var(--t-micro) var(--ease-in)}
  #dailyCard:hover{color:var(--ink)}
  #dailyCard:disabled{opacity:.55;cursor:default}
  #dailyCard .dk{display:inline;font-size:10px;letter-spacing:.42em;color:var(--ink-faint);white-space:nowrap}
  #dailyCard .dv{display:inline;font-size:12.5px;letter-spacing:.14em;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 文字按钮：分享图 */
  .txt-btn{display:block;margin:14px auto 0;background:none;border:none;color:var(--ink-faint);
    font-family:inherit;font-size:12px;letter-spacing:.32em;cursor:pointer;padding:8px 14px;
    transition:color var(--t-micro) var(--ease-in),opacity var(--t-micro) var(--ease-in)}
  .txt-btn:hover{color:var(--ink)}

  /* 骨架屏：几条淡淡的灰条呼吸，2.2s，延迟 60ms 递增 */
  #skeleton{margin:18px auto 0;padding:16px 18px 20px;background:var(--card);
    backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
    border:1px solid var(--glass-brd);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
  .sk-row{height:12px;border-radius:999px;background:var(--ink-faint);opacity:.2;margin:15px 0;
    animation:skBreath var(--t-amb) ease-in-out infinite alternate}
  .sk-row:nth-child(1){width:38%;animation-delay:0ms}
  .sk-row:nth-child(2){width:72%;animation-delay:60ms}
  .sk-row:nth-child(3){width:54%;animation-delay:120ms}
  .sk-row:nth-child(4){width:84%;animation-delay:180ms}
  .sk-row:nth-child(5){width:46%;animation-delay:240ms}
  .sk-row:nth-child(6){width:66%;animation-delay:300ms}
  #skeleton.off{animation:mistOut var(--t-exit) var(--ease-out) both}
  #skeletonMsg{display:none;text-align:center;color:var(--ink-faint);font-size:12px;letter-spacing:.22em;padding:8px 0 4px}

  /* 封面呼吸光晕：取 --accent，只在播放时亮起，暂停熄灭；只动 opacity / transform */
  .cover-halo{position:absolute;left:50%;top:10px;width:232px;height:232px;
    transform:translateX(-50%);border-radius:26px;pointer-events:none;z-index:0;
    opacity:0;transition:opacity var(--t-enter) var(--ease-in)}
  body.playing .cover-halo{opacity:1}
  .cover-halo::after{content:'';position:absolute;inset:0;border-radius:26px;
    background:radial-gradient(closest-side,var(--accent) 0%,rgba(125,139,150,0) 72%);
    opacity:.25;animation:coverHalo 3.6s ease-in-out infinite alternate}

  /* 收藏：细线条空心／实心爱心，无 emoji */
  .fav{flex:none;width:26px;height:26px;background:none;border:none;padding:3px;cursor:pointer;
    color:var(--ink-faint);opacity:.6;
    transition:opacity var(--t-micro) var(--ease-in),transform var(--t-micro) var(--ease-in)}
  .fav:hover{opacity:1}
  .fav svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;
    stroke-linecap:round;stroke-linejoin:round;transition:fill var(--t-micro) var(--ease-in)}
  .fav.on{color:var(--accent-d);opacity:1}
  .fav.on svg{fill:var(--accent-d)}
  .fav-empty{padding:14px 10px;font-size:12px;letter-spacing:.22em;color:var(--ink-faint)}

  /* 睡眠定时剩余状态 */
  .sleep-state{margin-top:9px;min-height:14px;font-size:11px;letter-spacing:.18em;color:var(--ink-faint)}

  /* 分享海报弹窗 */
  #shareModal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(23,29,33,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  #shareModal.open{display:flex}
  #shareModal .sheet{width:min(86vw,360px);max-height:88vh;overflow:auto;background:var(--card);
    backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid var(--glass-brd);border-radius:24px;padding:20px;text-align:center;
    box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}
  #shareModal img{display:block;width:100%;height:auto;border-radius:14px}
  #shareModal .cap{margin-top:14px;font-size:11px;letter-spacing:.28em;color:var(--ink-faint)}
  #shareModal .row{margin-top:14px;display:flex;gap:10px;justify-content:center}
  #shareModal .row a,#shareModal .row button{font-family:inherit;font-size:12px;letter-spacing:.22em;
    color:var(--ink-dim);background:var(--row-hover);border:1px solid var(--glass-brd);border-radius:999px;
    padding:8px 18px;text-decoration:none;cursor:pointer;
    transition:color var(--t-micro) var(--ease-in),border-color var(--t-micro) var(--ease-in)}
  #shareModal .row a:hover,#shareModal .row button:hover{color:var(--ink)}

  /* 动效规范兜底：body 与 APlayer 自带皮肤里残留的「浏览器默认 ease」和 <150ms 突变，
     统一到雾系缓动；进度/音量数值条保持 0 缓动，跟随真实时间（不滞后、不抖）。
     #player 元素自身就是 .aplayer 根节点（APlayer 直接改造 container），
     因此必须用复合选择器 #player.aplayer，写成 #player .aplayer 会一条都匹配不上。 */
  body{transition:background var(--t-enter) var(--ease-in)}
  #player.aplayer,
  #player.aplayer *{transition-timing-function:var(--ease-in)}
  #player.aplayer .aplayer-pic .aplayer-button{transition-duration:var(--t-micro)}
  #player.aplayer.aplayer-fixed .aplayer-body,
  #player.aplayer.aplayer-fixed .aplayer-info,
  #player.aplayer .aplayer-list{transition-duration:var(--t-enter)}
  #player.aplayer .aplayer-bar .aplayer-loaded,
  #player.aplayer .aplayer-played .aplayer-thumb,
  #player.aplayer .aplayer-volume-wrap .aplayer-volume-bar-wrap .aplayer-volume-bar{transition:none}

  /* reduced-motion：关掉所有非必要动画，只留必要的状态切换 */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;animation-delay:0ms!important;
      transition-property:opacity,color,background-color,border-color!important;
      transition-duration:200ms!important;transition-timing-function:var(--ease-out)!important}
    .cover-halo::after,.sk-row,.dots span,.dotsline span{animation:none!important;opacity:.3}
    .grp-body{transition:none!important}
    #setPanel,#shareModal .sheet{filter:none!important}
  }
</style>
</head>

<script>
(function(){
  var OWNER='by0628', REPO='Music', DIR='songs';

  /* ---------------- lyrics engine ---------------- */
  function parseLrc(text){
    var out=[];
    (text||'').split(/\r?\n/).forEach(function(line){
      var tags=line.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/g);
      if(!tags) return;
      var txt=line.replace(/\[[^\]]*\]/g,'').trim();
      tags.forEach(function(tag){
        var m=tag.match(/\[(\d{1,2}):(\d{2}(?:\.\d{1,3})?)\]/);
        out.push({t:parseInt(m[1],10)*60+parseFloat(m[2]), text:txt});
      });
    });
    out.sort(function(a,b){return a.t-b.t;});
    return out.filter(function(l){return l.text;});
  }

  function lrclibGet(artist,title,dur){

  function lrclibSearch(artist,title,dur){
    var q='track_name='+encodeURIComponent(title)+(artist?'&artist_name='+encodeURIComponent(artist):'');
    return fetchT('https://lrclib.net/api/search?'+q).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(list){
        var cand=(list||[]).filter(function(x){ return x.syncedLyrics && !x.instrumental; });
        if(!cand.length) return null;
        /* 本地打分匹配：标题/歌手吻合度在浏览器本地算分，再结合时长差挑最像的一条 */
        function score(x){
          var s=0;
          if(norm(x.trackName||'')===norm(title)) s+=4;
          if(artist && norm(artist) && norm(x.artistName||'')===norm(artist)) s+=3;
          else if(artist && norm(artist) && norm(x.artistName||'').indexOf(norm(artist))>=0) s+=1;
          return s;
        }
        if(dur){
          cand.sort(function(a,b){
            var dd=Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur);
            return dd!==0 ? dd : score(b)-score(a);

  function cleanTitle(t){

  /* 最后备用歌词源：lyrics.ovh（无时间轴纯文本，按时长均分出行时间粗对齐滚动） */
  function ovhLyrics(artist,title,dur){
    if(!artist) return Promise.resolve(null);
    return fetch('https://api.lyrics.ovh/v1/'+encodeURIComponent(artist)+'/'+encodeURIComponent(title))
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })

  /* 无时间轴的纯文本歌词：按时长均分行时间粗对齐（有总比没有强） */
  /* 无轴纯文本粗对齐：把歌词铺进「前奏之后、尾奏之前」的区间。
     旧做法从 0 秒起把整首时长均分给歌词行，开头恒定领先 2~3 行（《唤水剑》即此类）；
     没有真同步轴时只能是估算，但至少不能把前奏算进歌词里。 */
  function plainToLines(txt, dur){
    var ls=(txt||'').split(/\r?\n/).map(function(s){ return s.trim(); })
      .filter(function(s){ return s && !/^\[[^\]]*\]$/.test(s)
        && !/^(词|曲|编曲|制作人|演唱|作词|作曲|混音|和声)\s*[:：]/.test(s); });
    if(ls.length<4) return null;

  /* 歌词来源优先级：本地 .lrc > 本地缓存 > LRCLIB 精确 > LRCLIB 搜索 > LRCLIB 清洗歌名重试 > LRCLIB 纯文本 > lyrics.ovh */
  /* 歌词本地缓存：匹配成功就存浏览器 localStorage，下次进站直接命中、不用再联网等 */

  function loadLyrics(idx){

      lrclibGet(meta.artist, meta.title, dur)
        .then(function(rec){ return rec && rec.syncedLyrics ? parseLrc(rec.syncedLyrics) : null; })
        .catch(function(){ return lrclibSearch(meta.artist, meta.title, dur).then(function(rec){ return rec ? parseLrc(rec.syncedLyrics) : null; }); })
        .catch(function(){ return null; })

          .catch(function(){ return lrclibSearch(meta.artist, cleaned, dur).then(function(rec){ return rec ? parseLrc(rec.syncedLyrics) : null; }); })

  /* ---------------- auto cover (iTunes) ---------------- */
  function norm(s){ return (s||'').toLowerCase().replace(/[\s\u3000·・'"'"'“”‘’()（）\[\]【】\-—_,，.。!！?？:：;；/\\]/g,''); }
  function itunesCover(meta, dur){

      .then(function(data){

        if(!res.length) return null;

          if(!inWin.length) return null;
          pick=inWin.filter(function(x){ return norm(cleanTitle(x.trackName))===norm(cleanTitle(meta.title)) && norm(x.artistName)===norm(meta.artist); })[0]
            || inWin.filter(function(x){ return norm(cleanTitle(x.trackName))===norm(cleanTitle(meta.title)); })[0]
            || inWin.filter(function(x){ return norm(x.artistName)===norm(meta.artist); })[0]
            || inWin[0];

  /* 封面取色：把主色调染进整页氛围（进度条、高亮歌词、月光） */
  function tintFromCover(url){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var cv=document.createElement('canvas'); cv.width=cv.height=24;
        var cx=cv.getContext('2d'); cx.drawImage(img,0,0,24,24);
        var d=cx.getImageData(0,0,24,24).data, r=0,g=0,b=0,w=0;
        for(var i=0;i<d.length;i+=4){
          var R=d[i],G=d[i+1],B=d[i+2];
          var mx=Math.max(R,G,B), mn=Math.min(R,G,B);
          if(mx<28||mx>245) continue;
          var weight=0.35+((mx-mn)/255);
          r+=R*weight; g+=G*weight; b+=B*weight; w+=weight;
        }
        if(!w) return;
        r=Math.round(r/w); g=Math.round(g/w); b=Math.round(b/w);
        /* 莫蘭迪化：向自身灰度靠攏、去飽和，再派生深/淺/底色四檔 */
        var gray=Math.round((r+g+b)/3);

        curTint={r:r, g:g, b:b};

        var singers=(x.singer||[]).map(function(sg){ return sg.name||''; }).join(' ');
        if(meta.artist && norm(meta.artist)){
          if(norm(singers)===norm(meta.artist)) s+=3;
          else if(norm(singers).indexOf(norm(meta.artist))>=0) s+=2;
        }
        return {x:x, s:s, dd: dur ? Math.abs((x.interval||0)-dur) : 0, i:i};
      }).filter(function(o){ return o.s>=4 && (!dur || o.dd<=4); });
      if(!scored.length) return null;
      /* 分数、时长差都相同时，信 QQ 自己的排序（官方版通常排最前，防翻唱/钢琴版同分抢位） */
      scored.sort(function(a,b){ return (b.s-a.s) || (a.dd-b.dd) || (a.i-b.i); });
      var urls=scored.slice(0,2).map(function(o){ return 'https://y.qq.com/music/photo_new/T002R500x500M000'+o.x.albummid+'.jpg'; });
      return verifyImgUrls(urls, 0);
    }).catch(function(){ return null; });
  }
  /* 备用封面源：MusicBrainz 找唱片 + Cover Art Archive 取图（同样用时长把关，防翻唱误配） */
  function mbCover(meta, dur){
    var q='recording:"'+(meta.title||'').replace(/"/g,'')+'"'+(meta.artist?' AND artistname:"'+meta.artist.replace(/"/g,'')+'"':'');
    var url='https://musicbrainz.org/ws/2/recording/?query='+encodeURIComponent(q)+'&fmt=json&limit=10';
    return fetchT(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var recs=(data.recordings||[]).filter(function(x){ return x.releases && x.releases.length; });
        if(!recs.length) return null;
        if(dur){
          recs=recs.filter(function(x){ return x.length && Math.abs(x.length/1000-dur)<=5; });
        }else{
          recs=recs.filter(function(x){
            var ac=(x['artist-credit'] && x['artist-credit'][0] && x['artist-credit'][0].name)||'';
            return norm(x.title)===norm(meta.title) && (!meta.artist || norm(ac)===norm(meta.artist));
          });
        }
        if(!recs.length) return null;
        recs.sort(function(a,b){
          var da=dur ? Math.abs((a.length||0)/1000-dur) : 0, db=dur ? Math.abs((b.length||0)/1000-dur) : 0;
          return da-db || (b.score||0)-(a.score||0);
        });
        var ids=[];
        recs.slice(0,3).forEach(function(x){ var id=x.releases[0] && x.releases[0].id; if(id && ids.indexOf(id)<0) ids.push(id); });
        return tryCaa(ids, 0);
      })
      .catch(function(){ return null; });
  }
  /* 验图：URL 真能加载才采用，坏图自动试下一张 */
  function verifyImgUrls(urls, i){
    if(i>=urls.length) return Promise.resolve(null);
    var url=urls[i];
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){ res(url); };
      im.onerror=function(){ res(verifyImgUrls(urls, i+1)); };
      im.src=url;
    });
  }
  function tryCaa(ids, i){
    if(i>=ids.length) return Promise.resolve(null);
    var url='https://coverartarchive.org/release/'+ids[i]+'/front-500';
    return new Promise(function(res){
      var im=new Image();
      im.onload=function(){ res(url); };
      im.onerror=function(){ res(tryCaa(ids, i+1)); };
      im.src=url;
    });
  }
  /* 封面来源优先级：本地同名图（建单时已处理） > QQ音乐 > iTunes > MusicBrainz/CoverArtArchive；全落空不生成本地图，保持纯黑并靠切歌重试 */
  function loadCover(idx, withDur){
    var st=coverState[idx];
    if(!st || st.done) return;
    if(withDur ? st.triedDur : st.triedNoDur) return;
    if(withDur) st.triedDur=true; else st.triedNoDur=true;
    var meta=songMeta[idx], dur=withDur ? durations[idx] : null;
    var covCached=null;
    try{ covCached=localStorage.getItem('unsentCovV1:'+(meta.artist||'')+'|'+meta.title); }catch(e){}
    if(covCached){
      /* 缓存里的第三方图片 URL 可能已失效：先验图，挂了就清掉重查，不让一次缓存定终身 */
      return verifyImgUrls([covCached], 0).then(function(ok){
        if(ok){ st.done=true; applyCover(idx, ok); return; }
        try{ localStorage.removeItem('unsentCovV1:'+(meta.artist||'')+'|'+meta.title); }catch(e){}
        st.done=false; st.triedDur=false; st.triedNoDur=false;
        return loadCover(idx, withDur);
      });
    }
    qqCover(meta, dur)
      .then(function(url){ return url || itunesCover(meta, dur).catch(function(){ return null; }); })
      .then(function(url){ return url || mbCover(meta, dur); })
      .then(function(url){
        if(url){
          st.done=true;
          try{ localStorage.setItem('unsentCovV1:'+(meta.artist||'')+'|'+meta.title, url); }catch(e){}
          applyCover(idx, url);
        }
        /* 全源落空：不造本地图，封面保持纯黑，下次切到这首会自动重查 */
      })
      .catch(function(){});
  }

  function syncLyrics(force){

      var nextT = li+1<st.lines.length ? st.lines[li+1].t : Infinity;

  /* 歌词扫光进度：每 100ms 更新当前行点亮比例 --p（只写样式，不动播放链）。
     二分查找与 syncLyrics 用同一套 st.lines[mid].t<=t 判定，保证 .cur 与 --p 指向同一行。
     force=true（换行/切歌）时必定写一次，绕开 0.6% 节流，避免新行停在默认 0% 或沿用旧值。 */
  var sweepLast={i:-1,p:-1};
  function sweepTick(force){
    if(!ap) return;
    var st=lyrState[curIdx]; if(!st || !st.lines || !st.lines.length) return;
    var t=ap.audio.currentTime||0, d=ap.audio.duration||0;
    var lo=0, hi=st.lines.length-1, idx=-1;
    while(lo<=hi){ var mid=(lo+hi)>>1; if(st.lines[mid].t<=t){ idx=mid; lo=mid+1; } else hi=mid-1; }
    if(idx<0){
      /* 前奏还没到第一句：当前行不点亮，清掉旧值 */
      [lrcScroll, stageScroll].forEach(function(c){
        var cur=c.querySelector('p.cur'); if(cur) cur.style.setProperty('--p','0%');

      return;
    }
    var start=st.lines[idx].t;
    var end=(idx+1<st.lines.length)?st.lines[idx+1].t:(d||start+5);
    if(end<=start) end=start+0.5;
    var pct=Math.max(0,Math.min(100,(t-start)/(end-start)*100));
    if(!force && idx===sweepLast.i && Math.abs(pct-sweepLast.p)<0.6) return;
    sweepLast={i:idx,p:pct};
    [lrcScroll, stageScroll].forEach(function(c){
      var el=c.querySelectorAll('p')[idx]; if(el) el.style.setProperty('--p', pct.toFixed(1)+'%');
    });
  }

  (function(){

  (function(){

    var savedTexts=new Map();

  var mainSha=null; /* 已弃用：不再调 branches 取 sha，jsDelivr 只用 @main 线路（保留变量防旧引用报错） */
  /* 站内清单 playlist.json 是主源：与页面同源（GitHub Pages 直发）、不限流、永远完整，

  function listViaManifest(){
    return fetchT('playlist.json?ts='+Math.floor(Date.now()/60000), 9000)
      .then(function(r){ if(!r.ok) throw new Error('manifest '+r.status); return r.json(); })
      .then(function(d){
        var names=[];
        (d||[]).forEach(function(f){

  function listViaJsdelivr(){
    return fetchT('https://data.jsdelivr.com/v1/packages/gh/'+OWNER+'/'+REPO+'@main?structure=flat', 9000)
      .then(function(r){ if(!r.ok) throw new Error('jsd '+r.status); return r.json(); })
      .then(function(d){
        var names=[];
        (d.files||[]).forEach(function(f){
          var prefix='/'+DIR+'/';
          if(f.name.indexOf(prefix)!==0) return;
          var rest=f.name.slice(prefix.length);
          if(rest && rest.indexOf('/')<0) names.push({name:rest, size:f.size||0});
        });
        if(!names.length) throw new Error('empty');
        return names;
      });
  }
  function listViaGithub(){
    /* 一次 trees 调用同时拿到文件名和大小；原来的 contents+branches 两次调用太费匿名限额（60 次/小时）。
       带 9 秒超时：国内网络下 api.github.com 卡住时不能把整张歌单拖死 */
    return fetchT(API+'/git/trees/main?recursive=1', 9000)
      .then(function(r){ if(!r.ok) throw new Error('tree '+r.status); return r.json(); })
      .then(function(d){
        var out=[], prefix=DIR+'/';
        (d.tree||[]).forEach(function(it){
          if(it.type!=='blob' || it.path.indexOf(prefix)!==0) return;
          var rest=it.path.slice(prefix.length);
          if(rest && rest.indexOf('/')<0) out.push({name:rest, size:it.size||0});
        });
        if(!out.length) throw new Error('empty');
        return out;
      });
  }
  /* 三路清单取并集：站内 playlist.json（主源，完整不限流）+ GitHub trees（实时，刚传的新歌靠它立刻出现）
     + jsDelivr（已被停更、只剩第一首歌，仅作前两路全挂时的最后兜底）。
     关键规矩：只有主源或 GitHub 任一成功，结果才算「完整」才准写缓存；
     只剩 jsDelivr 兜底的残缺歌单绝不缓存——旧版就是把一首歌的残缺结果写进缓存，才会一直只剩一首 */
  function settle(p){ return p.then(function(v){ return {ok:true, v:v}; }, function(){ return {ok:false}; }); }
  /* 歌单缓存：10 分钟内重复打开直接用缓存（0 次接口调用）；拉取失败/被限流时回退缓存渲染旧歌单，不让页面空着。
     带 ?v= 的链接（自测新歌时用）强制绕过缓存拿最新清单。
     V2 换键：V1 可能已被旧逻辑用一首歌的残缺清单毒化，直接弃用 */
  var LIST_KEY='unsentListV2';
  function readListCache(){
    try{ localStorage.removeItem('unsentListV1'); }catch(e){}

  function fetchListUnion(){
    return Promise.all([settle(listViaManifest()), settle(listViaGithub()), settle(listViaJsdelivr())])
      .then(function(rs){

        var seen={}, names=[];
        rs.forEach(function(r){
          if(!r.ok) return;
          (r.v||[]).forEach(function(it){
            if(!it || !it.name) return;
            if(!seen[it.name]){ seen[it.name]=it; names.push(it); }
            else if(!seen[it.name].size && it.size) seen[it.name].size=it.size; /* 并集时把文件大小也带上，大文件分流要用 */
          });
        });
        if(!names.length) throw new Error('no list');
        if(complete){ try{ localStorage.setItem(LIST_KEY, JSON.stringify({t:Date.now(), files:names})); }catch(e){} }
        return names;
      });

  /* 1. 播放记忆：记住歌曲序号 / 进度 / 音量；进站只恢复到暂停态，绝不尝试自动播放 */
  var memTimer=0, memRestore=null, memBusy=false, memSeeked=false;
  function readMem(){
    try{ var o=JSON.parse(localStorage.getItem(MEM_KEY)||'null'); if(o && typeof o==='object') return o; }catch(e){}
    return null;
  }
  function saveMem(){
    if(!ap || memBusy) return;
    /* 进站恢复还没把进度 seek 到位之前，别用 0 把上次的记忆覆盖掉 */
    if(memRestore && !memSeeked) return;
    try{
      localStorage.setItem(MEM_KEY, JSON.stringify({
        i: ap.list.index|0,
        t: Math.max(0, Math.floor(ap.audio.currentTime||0)),
        v: (typeof ap.audio.volume==='number') ? ap.audio.volume : 0.85
      }));
    }catch(e){}
  }
  function saveMemThrottled(){
    var now=Date.now();
    if(now-memTimer<4000) return;
    memTimer=now; saveMem();
  }
  function initPlayMemory(){
    if(!ap) return;
    var o=readMem();
    if(o && typeof o.v==='number' && o.v>=0 && o.v<=1){
      try{ if(ap.volume) ap.volume(o.v, true); else ap.audio.volume=o.v; }
      catch(e){ try{ ap.audio.volume=o.v; }catch(e2){} }
    }
    if(o && typeof o.i==='number' && o.i>=0 && o.i<songMeta.length){
      memRestore={i:o.i, t:Math.max(0,o.t||0)};
      if(o.i!==ap.list.index){
        memBusy=true;
        try{ ap.list.switch(o.i); }catch(e){}
        memBusy=false;
      }
      /* 暂停态下 APlayer 只切列表高亮、不会加载目标歌曲的音频，进度条会对应错误的音频。
         把 audio.src 指到目标歌曲首条线路并 load，保证「那首那秒」落在正确的音频上。
         只操作 HTMLAudioElement，不接 Web Audio API，也不调用 play()。 */
      var srcs=songSources[o.i];
      if(srcs && srcs.length && ap.audio){
        try{ ap.audio.src=srcs[0]; ap.audio.load(); }catch(e){}
      }
    }
    ap.audio.addEventListener('timeupdate', saveMemThrottled);
    ap.audio.addEventListener('volumechange', function(){ saveMem(); });
    ap.audio.addEventListener('pause', function(){ saveMem(); });
    window.addEventListener('beforeunload', saveMem);
    document.addEventListener('visibilitychange', function(){ if(document.hidden) saveMem(); });
    /* 元数据到位才能 seek；只做一次。浏览器禁止自动播放，这里绝不调用 play()。
       本地/CDN 秒回时 loadedmetadata 可能抢在监听器注册前触发，所以除事件外
       再做一次立即检查 + 短轮询兜底，避免「元数据早就绪却永不 seek」。 */
    var done=false, tries=0;
    function restoreSeek(){
      if(done || !memRestore) return;
      var a=ap.audio, d=a.duration, t=memRestore.t;
      if(!isFinite(d) || d<=0) return;                  /* 元数据未到位，等下一轮 */
      t=Math.min(t, Math.max(0,d-0.5));
      if(t>0){
        try{ a.currentTime=t; }catch(e){ return; }
        if(Math.abs((a.currentTime||0)-t)>1) return;   /* 浏览器还没接受，下一轮再试 */
      }
      done=true; memSeeked=true;
      try{ a.dispatchEvent(new Event('timeupdate')); }catch(e){}  /* 进度条跟着真实时间刷新 */
    }
    ap.audio.addEventListener('loadedmetadata', restoreSeek);
    ap.audio.addEventListener('canplay', restoreSeek);
    restoreSeek();                                     /* 事件已抢跑时立即兜底 */
    var seekTimer=setInterval(function(){
      if(done){ clearInterval(seekTimer); return; }
      if(tries++>40){ clearInterval(seekTimer); memSeeked=true; return; }  /* 最多 8 秒，之后放开保存 */
      restoreSeek();
    }, 200);
  }

  /* 2. 睡眠定时：到点先用 1 秒把音量淡到 0 再 pause；只改 HTMLAudioElement.volume，不碰 Web Audio */
  var sleepMode='0', sleepEnd=0, sleepTick=null, sleepFading=false, sleepEndIdx=-1;
  function sleepLabel(){
    var el=document.getElementById('sleepState'); if(!el) return;
    var txt;
    if(sleepMode==='0') txt='未开启';
    else if(sleepMode==='end') txt='播完这首后停下';
    else{
      var left=Math.max(0, Math.ceil((sleepEnd-Date.now())/1000));
      txt='剩余 '+Math.floor(left/60)+':'+('0'+(left%60)).slice(-2);
    }
    el.textContent=(window.T ? window.T(txt) : txt);
  }
  function markSleep(){
    var seg=document.getElementById('sleepSeg'); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-min')===sleepMode);
  }
  function fadeOutAndPause(){
    if(!ap || sleepFading) return;
    sleepFading=true;
    var v=(typeof ap.audio.volume==='number') ? ap.audio.volume : 0.85;
    var t0=Date.now();
    var iv=setInterval(function(){
      var k=Math.min(1,(Date.now()-t0)/1000);
      try{ ap.audio.volume=Math.max(0, v*(1-k)); }catch(e){}
      if(k>=1){
        clearInterval(iv);
        try{ ap.pause(); }catch(e){}
        try{ ap.audio.volume=v; }catch(e){}   /* 恢复音量，下次播放正常 */
        sleepMode='0'; sleepEnd=0; markSleep(); sleepLabel();
        sleepFading=false; saveMem();
      }
    }, 80);
  }
  function setSleep(mode){
    sleepMode=mode||'0'; sleepEnd=0;
    if(sleepTick){ clearInterval(sleepTick); sleepTick=null; }
    if(sleepMode!=='0' && sleepMode!=='end') sleepEnd=Date.now()+parseInt(sleepMode,10)*60000;
    if(sleepMode==='end') sleepEndIdx=curIdx;
    markSleep(); sleepLabel();
    if(sleepMode!=='0' && sleepMode!=='end'){
      sleepTick=setInterval(function(){
        if(Date.now()>=sleepEnd) fadeOutAndPause(); else sleepLabel();
      }, 1000);
    }
  }
  function initSleep(){
    var seg=document.getElementById('sleepSeg'); if(!seg) return;
    seg.addEventListener('click', function(e){
      var b=e.target.closest ? e.target.closest('button') : null;
      if(b) setSleep(b.getAttribute('data-min')||'0');
    });
    if(ap) ap.audio.addEventListener('ended', function(){
      if(sleepMode==='end' && ap.list.index===sleepEndIdx){ setSleep('0'); fadeOutAndPause(); }
    });
    markSleep(); sleepLabel();
  }

  /* 5. 骨架屏：歌单加载完成前雾面灰条呼吸，完成后淡出（与歌单淡入重叠） */
  function hideSkeleton(){
    var sk=document.getElementById('skeleton');
    if(!sk || sk.getAttribute('data-off')) return;
    sk.setAttribute('data-off','1');
    sk.classList.add('off');
    setTimeout(function(){ sk.style.display='none'; }, 560);
  }

  /* 6. 单曲分享海报：canvas 1080×1440；封面跨域画不进就退回纯文字排版（黑方块），不用任何假图 */
  function roundRectPath(x,l,t,w,h,r){
    x.beginPath(); x.moveTo(l+r,t); x.lineTo(l+w-r,t); x.quadraticCurveTo(l+w,t,l+w,t+r);
    x.lineTo(l+w,t+h-r); x.quadraticCurveTo(l+w,t+h,l+w-r,t+h);
    x.lineTo(l+r,t+h); x.quadraticCurveTo(l,t+h,l,t+h-r);
    x.lineTo(l,t+r); x.quadraticCurveTo(l,t,l+r,t); x.closePath();
  }
  function drawSpaced(x,text,cx,y,sp){
    var chars=String(text||'').split(''), w=[], total=0, i;
    for(i=0;i<chars.length;i++){ var cw=x.measureText(chars[i]).width; w.push(cw); total+=cw; }
    total+=sp*Math.max(0,chars.length-1);
    var px=cx-total/2, prev=x.textAlign;
    x.textAlign='left';
    for(i=0;i<chars.length;i++){ x.fillText(chars[i],px,y); px+=w[i]+sp; }
    x.textAlign=prev;
  }
  function currentLyricLine(){
    var el=document.querySelector('#lrcScroll p.cur');
    var s=el ? (el.textContent||'').replace(/\s+/g,' ').trim() : '';
    if(s.length>26) s=s.slice(0,26)+'…';
    return s;
  }
  function drawPoster(withCover, img, meta, line){
    var W=1080,H=1440,c=document.createElement('canvas'); c.width=W; c.height=H;
    var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#e9edeb'); g.addColorStop(1,'#dde3e0');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    var INK='#3a4147', DIM='#7c868d', ACC='#57646c', SER='"Noto Serif SC","Songti SC",serif';
    x.textAlign='center';
    x.fillStyle=DIM; x.font='22px '+SER; drawSpaced(x,'雾 中 来 信',W/2,120,10);
    var CX=(W-720)/2, CY=196;
    x.save(); roundRectPath(x,CX,CY,720,720,28); x.clip();
    if(withCover && img){
      try{ x.drawImage(img,CX,CY,720,720); }
      catch(e){ x.fillStyle='#101216'; x.fillRect(CX,CY,720,720); }
    }else{ x.fillStyle='#101216'; x.fillRect(CX,CY,720,720); }
    x.restore();
    x.strokeStyle='rgba(58,65,71,.10)'; x.lineWidth=1; roundRectPath(x,CX,CY,720,720,28); x.stroke();
    x.fillStyle=INK; x.font='46px '+SER; drawSpaced(x,meta.title||'',W/2,1010,8);
    x.fillStyle=DIM; x.font='26px '+SER; drawSpaced(x,meta.artist||'by0628',W/2,1074,6);
    x.fillStyle=ACC; x.font='28px '+SER; drawSpaced(x,line||'·',W/2,1172,4);
    x.strokeStyle='rgba(58,65,71,.14)'; x.beginPath(); x.moveTo(W/2-90,1238); x.lineTo(W/2+90,1238); x.stroke();
    x.fillStyle=INK; x.font='26px '+SER; drawSpaced(x,'雾中来信',W/2,1314,12);
    x.fillStyle=DIM; x.font='19px '+SER; drawSpaced(x,'by0628.github.io/Music',W/2,1362,3);
    return c;
  }
  function buildPoster(cb){
    var m=songMeta[curIdx] || {title:'',artist:''};
    var line=currentLyricLine(), url=m.cover||'';
    if(!url){ cb(drawPoster(false,null,m,line)); return; }
    var im=new Image(); im.crossOrigin='anonymous';
    var settled=false;
    var to=setTimeout(function(){
      if(settled) return; settled=true; cb(drawPoster(false,null,m,line));
    }, 6000);
    im.onload=function(){
      if(settled) return; settled=true; clearTimeout(to);
      var c=drawPoster(true,im,m,line);
      try{ c.toDataURL('image/png'); cb(c); }        /* 画布被跨域污染会在这里抛错 */
      catch(e){ cb(drawPoster(false,null,m,line)); }
    };
    im.onerror=function(){
      if(settled) return; settled=true; clearTimeout(to); cb(drawPoster(false,null,m,line));
    };
    im.src=url;
  }
  function initShare(){
    var btn=document.getElementById('shareBtn'), modal=document.getElementById('shareModal');
    if(!btn || !modal) return;
    var sheet=document.getElementById('shareSheet');
    btn.addEventListener('click', function(){
      var imgEl=document.getElementById('shareImg'), dl=document.getElementById('shareDl');
      buildPoster(function(canv){
        var data=canv.toDataURL('image/png');
        imgEl.src=data; dl.href=data;
        modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
        sheet.classList.remove('mist-in','mist-out'); void sheet.offsetWidth;
        sheet.classList.add('mist-in');
      });
    });
    function close(){
      if(!modal.classList.contains('open')) return;
      sheet.classList.remove('mist-in'); sheet.classList.add('mist-out');
      setTimeout(function(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }, 560);
    }
    var cb=document.getElementById('shareClose'); if(cb) cb.addEventListener('click', close);
    modal.addEventListener('click', function(e){ if(e.target===modal) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
  }

  /* 8. 每日一首：按本地日期做固定 hash，同一天全天同一首 */
  function dailyIndex(n){
    if(!n) return 0;
    var d=new Date();
    var key=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    var h=2166136261;
    for(var i=0;i<key.length;i++){ h^=key.charCodeAt(i); h=(h*16777619)>>>0; }
    return h % n;
  }
  function initDaily(){
    var card=document.getElementById('dailyCard'); if(!card) return;
    var i=dailyIndex(songMeta.length), m=songMeta[i]; if(!m) return;
    var TT=function(s){ return window.T ? window.T(s) : s; };
    var dv=card.querySelector('.dv');
    if(dv) dv.textContent=TT(m.title)+(m.artist ? ' — '+TT(m.artist) : '');
    card.disabled=false;
    card.addEventListener('click', function(){ if(ap){ ap.list.switch(i); ap.play(); } });
  }

  var listPromise;
  if(cachedList && !/[?&]v=/.test(location.search) && (Date.now()-(cachedList.t||0))<600000){
    listPromise=Promise.resolve(cachedList.files);
  }else{
    listPromise=fetchListUnion().then(null, function(){ if(cachedList) return cachedList.files; throw new Error('no list'); });
  }
  listPromise
    .then(function(files){
      var covers={}, lrcFiles={}, lrcSizes={};
      files.forEach(function(f){
        var e=ext(f.name);
        if(IMG.indexOf(e)>=0) covers[base(f.name)]=CDN+encodeURIComponent(f.name);
        if(e==='lrc'){ lrcFiles[base(f.name)]=f.name; lrcSizes[base(f.name)]=f.size||0; }
      });
      var songs=files.filter(function(f){return AUDIO.indexOf(ext(f.name))>=0;})
        .sort(function(a,b){return a.name.localeCompare(b.name,'zh');})
        .map(function(f){
          var b=base(f.name), nm=splitName(b);
          var srcs=sourcesFor(encodeURIComponent(f.name), (f.size||0) >= 20*1024*1024);
          songSources.push(srcs);
          songMeta.push({artist:nm.artist, title:nm.title, file:b, lrcFile:lrcFiles[b]||null, lrcSize:lrcSizes[b]||0, cover:covers[b]||null});
          lyrState.push({status:'idle', lines:null});
          coverState.push({done:!!covers[b], triedNoDur:false, triedDur:false});
          var s={name:nm.title, artist:nm.artist||'by0628', url:srcs[0]};
          if(covers[b]) s.cover=covers[b];
          return s;
        });
      if(!songs.length){
        statusEl.textContent=T('歌单还空着——第一首歌，正在来的路上。');
        return;
      }
      statusEl.textContent=T('共 '+songs.length+' 首 · 点开任意一首开始');
      ap=new APlayer({
        container:document.getElementById('player'),
        audio:songs, theme:'#7d8b96', lrcType:0,
        listFolded:false, preload:'metadata', volume:0.85, mutex:true
      });
      /* 当前线路报错就自动顺延到下一条，直到能播为止 */
      var attempts={};
      ap.audio.addEventListener('error', function(){
        var i=ap.list.index, srcs=songSources[i];
        if(!srcs) return;
        var next=(attempts[i]||0)+1;
        if(next>=srcs.length) return;
        attempts[i]=next;
        var resume=!ap.audio.paused;
        ap.list.audios[i].url=srcs[next];
        ap.audio.src=srcs[next];
        if(resume) ap.play();
      });
      ap.audio.addEventListener('loadedmetadata', function(){
        durations[ap.list.index]=ap.audio.duration;
        var drow=groupsEl ? groupsEl.querySelector('.grp-row[data-gi="'+ap.list.index+'"] .dur') : null;
        if(drow) drow.textContent=fmtDur(ap.audio.duration);
        loadLyrics(ap.list.index);
        loadCover(ap.list.index, true);
      });
      ap.on('listswitch', function(e){
        curIdx=e.index; curLine=-1;
        saveMem();
        if(sleepMode==='end') sleepEndIdx=curIdx;
        msSig=''; msAlbum=MS_FALLBACK_ALBUM;  /* 切歌先复位，别把上一首的歌词留在锁屏 */
        updateMS();                           /* 先写标题/歌手；封面迟到时 applyCover 会再重建一次 */
        markGroupCurrent();
        expandGroupForSong(curIdx);
        stageTitle.textContent=T(songMeta[curIdx] ? (songMeta[curIdx].artist ? songMeta[curIdx].artist+' - ' : '')+songMeta[curIdx].title : '');
        if(window.refreshLangDOM) window.refreshLangDOM();
        renderLyrics();
        loadLyrics(curIdx);
        if(coverState[curIdx] && !coverState[curIdx].done && !(songMeta[curIdx] && songMeta[curIdx].cover)){
          /* 还没有真封面：每次切到这首都重查一次线上源，不让任何一次网络失败定终身 */
          coverState[curIdx].triedDur=false;
          loadCover(curIdx, true);
        }else{
          loadCover(curIdx, false);
        }
        vinylize();
        if(songMeta[curIdx].cover) tintFromCover(songMeta[curIdx].cover); else resetTint();
        applyStageBg();
        updateMS();
        warmNext();
      });
      buildGroups();
      initPlayMemory();
      initSleep();
      initDaily();
      initShare();
      refreshFavGroup();
      preloadAll();
      warmNext();
      stageTitle.textContent=T((songMeta[0].artist ? songMeta[0].artist+' - ' : '')+songMeta[0].title);
      stageBtn.style.display='block';
      loadCover(0, false);
      applyStageBg();
      vinylize();
      ap.on('play', function(){
        document.body.classList.add('playing');
        if('mediaSession' in navigator) try{ navigator.mediaSession.playbackState='playing'; }catch(e){}
      });
      ap.on('pause', function(){
        document.body.classList.remove('playing');
        if('mediaSession' in navigator) try{ navigator.mediaSession.playbackState='paused'; }catch(e){}
      });
      if('mediaSession' in navigator){
        try{
          var msA=navigator.mediaSession;
          msA.setActionHandler('play', function(){ ap.play(); });
          msA.setActionHandler('pause', function(){ ap.pause(); });
          msA.setActionHandler('previoustrack', function(){ ap.skipBack(); });
          msA.setActionHandler('nexttrack', function(){ ap.skipForward(); });
          msA.setActionHandler('seekto', function(d){ if(d && d.seekTime!=null) ap.audio.currentTime=d.seekTime; });
        }catch(e){}
        updateMS();
      }
      /* 等元数据给出时长再匹配歌词更准；3.5 秒还没等到就先直接查 */
      setTimeout(function(){ loadLyrics(ap.list.index); }, 3500);
    })
    .catch(function(){
      statusEl.textContent=T('歌单暂时没打开（网络或接口限流），刷新一次试试。');
      var msg=document.getElementById('skeletonMsg');
      if(msg){ msg.textContent=(window.T?window.T('歌单还没打开 · 刷新一次试试'):'歌单还没打开 · 刷新一次试试'); msg.style.display='block'; }
    });

})();
</script>
